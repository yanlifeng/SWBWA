:root[data-theme=&quot;light&quot;] {

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected

}

.btn:focus-visible {

svg {

        `Stage 2: ${fmt(d.stage2_s)} s&lt;br&gt;` +
        `Stage 3: ${fmt(d.stage3_s)} s&lt;br&gt;` +
        `最长累计阶段: ${bottleneck.short}`;
      const rr = root.getBoundingClientRect();

      tooltip.style.left = `${Math.min(event.clientX - rr.left + 12, root.clientWidth - tooltip.offsetWidth - 4)}px`;

    function facet(container, title) {

        .call(d3.axisBottom(x).ticks(width &lt; 430 ? 4 : 5).tickSizeOuter(0));
      svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;axis&#x27;)
        .attr(&#x27;transform&#x27;, `translate(${margin.left},0)`)
        .call(d3.axisLeft(y).tickFormat(d =&gt; configLabel.get(d)).tickSize(0))
        .call(g =&gt; g.select(&#x27;.domain&#x27;).remove());
      svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;, &#x27;x&#x27;)

    function drawStacked(div, data, onlyStage2) {

      const max = d3.max(data, d =&gt; onlyStage2 ? d.stage2_s : d.stage1_s + d.stage2_s + d.stage3_s);
      const x = d3.scaleLinear().domain([0, max * 1.12]).nice().range([ctx.margin.left, ctx.margin.left + ctx.innerW]);
      const y = d3.scaleBand().domain(configs).range([ctx.margin.top, ctx.margin.top + ctx.innerH]).padding(0.3);
      axes(ctx, x, y);
      data.forEach(d =&gt; {
        let start = 0;
        const visibleStages = onlyStage2 ? stages.filter(s =&gt; s.key === &#x27;stage2_s&#x27;) : stages;

          ctx.svg.append(&#x27;rect&#x27;)
            .attr(&#x27;x&#x27;, x0).attr(&#x27;y&#x27;, y(d.configuration))
            .attr(&#x27;width&#x27;, Math.max(0, x1 - x0)).attr(&#x27;height&#x27;, y.bandwidth())
            .attr(&#x27;fill&#x27;, s.css).attr(&#x27;data-stage&#x27;, s.key)
            .style(&#x27;opacity&#x27;, active.has(s.key) ? 1 : 0.08)
            .on(&#x27;mousemove&#x27;, event =&gt; showTip(event, d)).on(&#x27;mouseleave&#x27;, hideTip);
          if (x1 - x0 &gt; 42) {
            ctx.svg.append(&#x27;text&#x27;).attr(&#x27;data-stage&#x27;, s.key)
              .attr(&#x27;x&#x27;, (x0 + x1) / 2).attr(&#x27;y&#x27;, y(d.configuration) + y.bandwidth() / 2 + 4)
              .attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).style(&#x27;font-weight&#x27;, 650)
              .style(&#x27;opacity&#x27;, active.has(s.key) ? 1 : 0.08).text(fmt(d[s.key]));
          }
          start += d[s.key];

        const end = onlyStage2 ? d.stage2_s : start;
        ctx.svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;, x(end) + 4)
          .attr(&#x27;y&#x27;, y(d.configuration) + y.bandwidth() / 2 + 4)
          .text(onlyStage2 ? `${fmt(d.stage2_s)} s` : `${fmt(d.total_s)} s`);

    function drawOverlap(div, data) {
      const ctx = baseSvg(div, 39);
      const max = d3.max(data, d =&gt; Math.max(d.total_s, d.stage1_s, d.stage2_s, d.stage3_s));
      const x = d3.scaleLinear().domain([0, max * 1.18]).nice().range([ctx.margin.left, ctx.margin.left + ctx.innerW]);
      const y = d3.scaleBand().domain(configs).range([ctx.margin.top, ctx.margin.top + ctx.innerH]).padding(0.24);
      axes(ctx, x, y);
      data.forEach(d =&gt; {
        const cy = y(d.configuration) + y.bandwidth() / 2;
        ctx.svg.append(&#x27;line&#x27;).attr(&#x27;x1&#x27;, x(0)).attr(&#x27;x2&#x27;, x(d.total_s)).attr(&#x27;y1&#x27;, cy).attr(&#x27;y2&#x27;, cy)
          .attr(&#x27;stroke&#x27;, &#x27;var(--foreground)&#x27;).attr(&#x27;stroke-opacity&#x27;, 0.28).attr(&#x27;stroke-width&#x27;, 1);
        ctx.svg.append(&#x27;rect&#x27;).attr(&#x27;x&#x27;, x(d.total_s) - 4).attr(&#x27;y&#x27;, cy - 4).attr(&#x27;width&#x27;, 8).attr(&#x27;height&#x27;, 8)
          .attr(&#x27;fill&#x27;, &#x27;var(--foreground)&#x27;).attr(&#x27;transform&#x27;, `rotate(45 ${x(d.total_s)} ${cy})`);
        const offsets = [-7, 0, 7];
        stages.forEach((s, i) =&gt; {
          ctx.svg.append(&#x27;line&#x27;).attr(&#x27;data-stage&#x27;, s.key)
            .attr(&#x27;x1&#x27;, x(0)).attr(&#x27;x2&#x27;, x(d[s.key])).attr(&#x27;y1&#x27;, cy + offsets[i]).attr(&#x27;y2&#x27;, cy + offsets[i])
            .attr(&#x27;stroke&#x27;, s.css).attr(&#x27;stroke-width&#x27;, 3)
            .style(&#x27;opacity&#x27;, active.has(s.key) ? 1 : 0.08);
          ctx.svg.append(&#x27;circle&#x27;).attr(&#x27;data-stage&#x27;, s.key)
            .attr(&#x27;cx&#x27;, x(d[s.key])).attr(&#x27;cy&#x27;, cy + offsets[i]).attr(&#x27;r&#x27;, 3.5).attr(&#x27;fill&#x27;, s.css)
            .style(&#x27;opacity&#x27;, active.has(s.key) ? 1 : 0.08);

        const bottleneck = stages.reduce((best, s) =&gt; d[s.key] &gt; d[best.key] ? s : best, stages[0]);
        const bx = x(d[bottleneck.key]);

        ctx.svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;, bx + (edge ? -5 : 5)).attr(&#x27;y&#x27;, cy - 11)
          .attr(&#x27;text-anchor&#x27;, edge ? &#x27;end&#x27; : &#x27;start&#x27;).style(&#x27;font-weight&#x27;, 700)
          .text(`${bottleneck.short} ${fmt(d[bottleneck.key])}`);
        ctx.svg.append(&#x27;rect&#x27;).attr(&#x27;data-chart-hit&#x27;, &#x27;&#x27;).attr(&#x27;x&#x27;, ctx.margin.left).attr(&#x27;y&#x27;, y(d.configuration))
          .attr(&#x27;width&#x27;, ctx.innerW).attr(&#x27;height&#x27;, y.bandwidth()).attr(&#x27;fill&#x27;, &#x27;transparent&#x27;)
          .on(&#x27;mousemove&#x27;, event =&gt; showTip(event, d)).on(&#x27;mouseleave&#x27;, hideTip);
      });
    }

    function render() {
      const stacked = root.querySelector(&#x27;#swbwa-has1-stacked&#x27;);
      const stage2 = root.querySelector(&#x27;#swbwa-has1-stage2&#x27;);
      const overlap = root.querySelector(&#x27;#swbwa-no1-overlap&#x27;);
      stacked.innerHTML = &#x27;&#x27;; stage2.innerHTML = &#x27;&#x27;; overlap.innerHTML = &#x27;&#x27;;
      workloads.forEach(([dataset, mode]) =&gt; {
        const title = workloadTitle(dataset, mode);
        drawStacked(facet(stacked, title), subset(&#x27;has1&#x27;, dataset, mode), false);
        drawStacked(facet(stage2, title), subset(&#x27;has1&#x27;, dataset, mode), true);
        drawOverlap(facet(overlap, title), subset(&#x27;no1&#x27;, dataset, mode));

    }

    root.querySelectorAll(&#x27;.legend button[data-stage]&#x27;).forEach(button =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {

  })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;

    if (tooltip == null) {

      tooltip.id = tooltipId;

      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {

    activeTrigger = null;

      middleware: [
        offset(tooltipGap),

        shift({ padding: tooltipGap }),

            );

      .then(({ x, y }) =&gt; {

          return;

        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;

      });

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

    }

    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

    }

  document.addEventListener(&quot;pointerout&quot;, handleLeave);

  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
